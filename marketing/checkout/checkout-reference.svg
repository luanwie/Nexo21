<text x="1270" y="678" fill="#1F2A26" font-family="Arial, sans-serif" font-size="16" font-weight="700">Tu correo electrónico</text><rect x="1270" y="696" width="374" height="53" rx="7" fill="#FFFFFF" stroke="#B9C0BA" stroke-width="2"/><text x="1288" y="729" fill="#929B95" font-family="Arial, sans-serif" font-size="16">nombre@correo.com</text>
<text x="1270" y="790" fill="#1F2A26" font-family="Arial, sans-serif" font-size="16" font-weight="700">Método de pago</text><rect x="1270" y="808" width="374" height="53" rx="7" fill="#FFFFFF" stroke="#B9C0BA" stroke-width="2"/><text x="1288" y="841" fill="#6C766F" font-family="Arial, sans-serif" font-size="16">Tarjeta de crédito o débito</text>
<rect x="1270" y="886" width="374" height="59" rx="8" fill="#B9684F"/><text x="1457" y="923" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">Continuar con el pago</text>
</g>
<text x="160" y="1115" fill="#6C766F" font-family="Arial, sans-serif" font-size="18">El acceso se habilita después de la confirmación del pago. Ingresa con el correo usado en la compra.</text>

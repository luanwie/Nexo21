<text x="650" y="899" fill="#1F2A26" font-family="Arial, sans-serif" font-size="18" font-weight="700">GARANTÍA DE 7 DÍAS</text><text x="650" y="931" fill="#6C766F" font-family="Arial, sans-serif" font-size="16">Conoce el recorrido con tranquilidad.</text>


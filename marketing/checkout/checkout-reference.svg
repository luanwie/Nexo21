<line x1="624" y1="578" x2="1150" y2="578" stroke="#E8E1DA" stroke-width="2"/>
<text x="624" y="630" fill="#1F2A26" font-family="Arial, sans-serif" font-size="22" font-weight="700">Incluye</text>
<g fill="#46534D" font-family="Arial, sans-serif" font-size="20"><text x="624" y="681">✓  21 días guiados</text><text x="624" y="727">✓  Diario digital</text><text x="624" y="773">✓  Conversaciones y mensajes</text><text x="624" y="819">✓  Plan de continuidad</text></g>

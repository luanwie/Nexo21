<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title">
<title id="title">Referência visual do checkout Nexo 21</title>
<defs>
  <pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r=".6" fill="#1F2A26" opacity=".06"/><circle cx="15" cy="12" r=".4" fill="#1F2A26" opacity=".04"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#1F2A26" flood-opacity=".16"/></filter>
</defs>
<rect width="1920" height="1200" fill="#F7F2EA"/><rect width="1920" height="1200" fill="url(#grain)"/>
<circle cx="1780" cy="1050" r="475" fill="#D8B6A8" opacity=".46"/><circle cx="1780" cy="1050" r="352" fill="none" stroke="#B9684F" stroke-width="3" opacity=".32"/>
<rect x="66" y="38" width="372" height="44" rx="22" fill="#1F2A26"/><text x="94" y="67" fill="#F7F2EA" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.2">REFERÊNCIA DE LAYOUT · RASCUNHO</text>

<g filter="url(#shadow)">
<rect x="160" y="130" width="1600" height="900" rx="18" fill="#FFFFFF"/>
<!-- banner -->
<rect x="160" y="130" width="1600" height="260" rx="18" fill="#1F2A26"/>
<circle cx="1650" cy="252" r="220" fill="#B9684F"/><circle cx="1650" cy="252" r="160" fill="none" stroke="#D8B6A8" stroke-width="2" opacity=".5"/>
<g transform="translate(238 176)"><path d="M18 70V47C18 30.98 30.98 18 47 18S76 30.98 76 47v23" fill="none" stroke="#F7F2EA" stroke-width="6" stroke-linecap="round"/><path d="M30 70V51c0-9.39 7.61-17 17-17s17 7.61 17 17v19" fill="none" stroke="#D8B6A8" stroke-width="5" stroke-linecap="round"/><path d="M47 34v36" fill="none" stroke="#C6A66B" stroke-width="4" stroke-linecap="round"/><text x="111" y="61" fill="#F7F2EA" font-family="Arial, sans-serif" font-size="37" font-weight="700" letter-spacing="8">NEXO 21</text></g>
<text x="240" y="310" fill="#C6A66B" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3.3">RECORRIDO CRISTIANO PARA PAREJAS</text>
<text x="238" y="360" fill="#F7F2EA" font-family="Georgia, serif" font-size="51" font-weight="700">21 días de fe y conversación</text>


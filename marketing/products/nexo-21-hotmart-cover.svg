<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Nexo 21 — capa de producto</title>
  <desc id="desc">Portada para Nexo 21: recorrido cristiano de 21 días para cuidar el vínculo.</desc>
  <defs>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r=".7" fill="#F7F2EA" opacity=".10"/>
      <circle cx="13" cy="10" r=".55" fill="#F7F2EA" opacity=".08"/>
      <circle cx="7" cy="16" r=".45" fill="#F7F2EA" opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="14" dy="16" stdDeviation="0" flood-color="#121B18" flood-opacity=".34"/></filter>
  </defs>

  <rect width="1080" height="1080" fill="#1F2A26"/>
  <rect width="1080" height="1080" fill="url(#grain)"/>
  <circle cx="1040" cy="620" r="420" fill="#B9684F"/>
  <circle cx="1040" cy="620" r="302" fill="none" stroke="#D8B6A8" stroke-width="2" opacity=".45"/>
  <path d="M770 988C860 917 933 832 987 722" fill="none" stroke="#C6A66B" stroke-width="3" opacity=".85"/>

  <g transform="translate(88 84)">
    <path d="M18 70V47C18 30.98 30.98 18 47 18S76 30.98 76 47v23" fill="none" stroke="#F7F2EA" stroke-width="6" stroke-linecap="round"/>
    <path d="M30 70V51c0-9.39 7.61-17 17-17s17 7.61 17 17v19" fill="none" stroke="#D8B6A8" stroke-width="5" stroke-linecap="round"/>
    <path d="M47 34v36" fill="none" stroke="#C6A66B" stroke-width="4" stroke-linecap="round"/>
    <text x="112" y="60" fill="#F7F2EA" font-family="Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="8">NEXO 21</text>
  </g>

  <text x="90" y="282" fill="#C6A66B" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3.2">RECORRIDO CRISTIANO PARA PAREJAS</text>
  <line x1="90" y1="322" x2="352" y2="322" stroke="#D8B6A8" stroke-width="3"/>

  <text x="86" y="450" fill="#F7F2EA" font-family="Georgia, serif" font-size="103" font-weight="700" letter-spacing="-3">21 días</text>
  <text x="86" y="562" fill="#F7F2EA" font-family="Georgia, serif" font-size="103" font-weight="700" letter-spacing="-3">de fe y</text>
  <text x="86" y="674" fill="#F7F2EA" font-family="Georgia, serif" font-size="103" font-weight="700" letter-spacing="-3">conversación</text>

  <g filter="url(#shadow)">
    <rect x="90" y="758" width="578" height="147" rx="2" fill="#F7F2EA"/>
    <text x="126" y="812" fill="#1F2A26" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.2">UN CAMINO DE REGRESO A LO COTIDIANO</text>
    <text x="126" y="862" fill="#B9684F" font-family="Georgia, serif" font-size="30">Atención. Diálogo. Pequeños hábitos.</text>
  </g>

  <text x="90" y="990" fill="#F7F2EA" font-family="Arial, sans-serif" font-size="22" opacity=".92">Guía diaria para leer, escribir y compartir.</text>
  <text x="90" y="1029" fill="#D8B6A8" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.8">ACCESO DIGITAL · 21 DÍAS</text>
</svg>

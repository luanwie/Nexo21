<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Intimidad y presencia</title><desc id="desc">Capa Nexo 21 para um percurso de proximidade, escuta e afeto respeitoso.</desc>
  <defs><pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="#F7F2EA" opacity=".10"/><circle cx="13" cy="10" r=".55" fill="#F7F2EA" opacity=".08"/></pattern><filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="14" dy="16" stdDeviation="0" flood-color="#121B18" flood-opacity=".32"/></filter></defs>
  <rect width="1080" height="1080" fill="#1F2A26"/><rect width="1080" height="1080" fill="url(#grain)"/><circle cx="1060" cy="790" r="427" fill="#B9684F"/><circle cx="1060" cy="790" r="305" fill="none" stroke="#D8B6A8" stroke-width="2" opacity=".48"/><path d="M762 1013c94-90 177-188 234-302" fill="none" stroke="#C6A66B" stroke-width="3" opacity=".84"/>
  <g transform="translate(88 84)"><path d="M18 70V47C18 30.98 30.98 18 47 18S76 30.98 76 47v23" fill="none" stroke="#F7F2EA" stroke-width="6" stroke-linecap="round"/><path d="M30 70V51c0-9.39 7.61-17 17-17s17 7.61 17 17v19" fill="none" stroke="#D8B6A8" stroke-width="5" stroke-linecap="round"/><path d="M47 34v36" fill="none" stroke="#C6A66B" stroke-width="4" stroke-linecap="round"/><text x="112" y="60" fill="#F7F2EA" font-family="Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="8">NEXO 21</text></g>
  <text x="90" y="284" fill="#C6A66B" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3.1">RECORRIDO DE CERCANÍA PARA PAREJAS</text><line x1="90" y1="324" x2="350" y2="324" stroke="#D8B6A8" stroke-width="3"/>
  <text x="86" y="464" fill="#F7F2EA" font-family="Georgia, serif" font-size="103" font-weight="700" letter-spacing="-4">Intimidad</text><text x="86" y="576" fill="#F7F2EA" font-family="Georgia, serif" font-size="103" font-weight="700" letter-spacing="-4">y presencia</text><text x="88" y="641" fill="#D8B6A8" font-family="Arial, sans-serif" font-size="24">Cercanía, escucha y afecto con respeto.</text>
  <g filter="url(#shadow)"><rect x="90" y="724" width="646" height="177" rx="2" fill="#F7F2EA"/><text x="126" y="782" fill="#1F2A26" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">14 DÍAS DE CONVERSACIONES Y ACCIONES</text><text x="126" y="833" fill="#B9684F" font-family="Georgia, serif" font-size="28">Propuestas para escuchar, expresar</text><text x="126" y="868" fill="#B9684F" font-family="Georgia, serif" font-size="28">y cuidar los límites de cada persona.</text></g>
  <text x="90" y="972" fill="#F7F2EA" font-family="Arial, sans-serif" font-size="22" opacity=".92">Un espacio educativo para acercarse con cuidado.</text><text x="90" y="1028" fill="#D8B6A8" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.8">ACCESO DIGITAL · 14 DÍAS</text>

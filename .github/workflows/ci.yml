name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.db
      BETTER_AUTH_SECRET: ci-only-secret-that-is-longer-than-thirty-two-bytes
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CHECKOUT_PROVIDER: mock
      ENABLE_MOCK_CHECKOUT: "false"
      CHECKOUT_WEBHOOK_SECRET: ci-webhook-secret
      ADMIN_EMAIL: admin@nexo21.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-that-is-longer-than-thirty-two-bytes
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CHECKOUT_PROVIDER: disabled
      ENABLE_MOCK_CHECKOUT: "false"
      HOTMART_WEBHOOK_ENABLED: "false"
      ADMIN_EMAIL: admin@nexo21.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: RUN_DATABASE_TESTS=true npx vitest run tests/integration/checkout-service.integration.test.ts
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
